name: Node.js CI

# Trigger this workflow on every push or pull request to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Download your repository code onto the cloud Ubuntu runner
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up Node.js on the cloud runner
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    # 3. Install dependencies securely using your lockfile
    - name: Install dependencies
      run: npm ci

    # 4. Run your test script
    - name: Run tests
      run: npm test
